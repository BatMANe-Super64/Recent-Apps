name: Build Wii U Aroma Plugin

on:
  push:
    branches: [main, master, 2.0, feature/recent-apps-overlay, feature/recent-apps-overlay-next, feature/interactive-recent-apps, test/title-icons-notification, release/finishing-polish]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WUPS plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --pull -t recent-apps-builder .

      - name: Compile plugin
        run: |
          docker run --rm -v "$PWD:/project" recent-apps-builder sh -lc '
            make clean
            make
            test -s RecentAppMenu.wps
          '

      - name: Upload WPS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecentAppMenu-Plugin
          path: RecentAppMenu.wps
          if-no-files-found: error
          compression-level: 0
